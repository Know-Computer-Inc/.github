# Starter workflow: dependency and credential audit.
#
# Runs the ecosystem-native audit tool for every manifest it finds, and fails
# the build on known-vulnerable dependencies at "high" severity or above.
#
#   - npm:        npm audit (needs a lockfile; the job is skipped without one)
#   - python:     pip-audit against requirements.txt or the local project
#   - rust:       cargo audit against Cargo.lock (the job is skipped without one)
#
# Security updates are never merged automatically: this workflow reports, a
# human decides. See docs/REPOSITORY_STANDARDS.md.

name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect ecosystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      npm: ${{ steps.manifests.outputs.npm }}
      python: ${{ steps.manifests.outputs.python }}
      rust: ${{ steps.manifests.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check manifests
        id: manifests
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Cargo.lock ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  npm:
    name: npm audit
    needs: detect
    if: needs.detect.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

  python:
    name: pip-audit
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            pip-audit .
          fi

  rust:
    name: cargo audit
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit lockfile
        run: cargo audit

  result:
    name: Audit result
    runs-on: ubuntu-latest
    needs: [detect, npm, python, rust]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if any audit job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
            *) exit 0 ;;
          esac
