# Starter workflow: Python repository.
#
# Assumptions (edit them if they are wrong for your repository):
#   - Python 3.12, tests under tests/ or a pytest configuration present;
#   - linting with ruff, tests with pytest (falls back to unittest);
#   - no packaging step unless a build backend is configured.
#
# If the "Test" step fails with "no test command found", the repository has no
# tests. That failure is intentional: a green check with no tests is worse than
# a red one.

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install -e .
          else
            echo "No requirements.txt or pyproject.toml — running as a plain source tree."
          fi

      - name: Install developer tools
        # Unpinned developer tooling on purpose: pin these if your repository
        # needs reproducible lint output.
        run: python -m pip install --disable-pip-version-check ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (pyright, only if configured)
        run: |
          if [ -f pyproject.toml ] && grep -qE '\[tool\.(pyright|mypy)\]' pyproject.toml; then
            python -m pip install --disable-pip-version-check pyright
            pyright
          else
            echo "No pyright/mypy configuration found — skipping."
          fi

      - name: Test
        run: |
          if [ -d tests ] || [ -d test ] || [ -f pytest.ini ] || [ -f tox.ini ] \
             || { [ -f pyproject.toml ] && grep -q 'tool.pytest' pyproject.toml; }; then
            python -m pytest
          elif find . -name 'test_*.py' -not -path './.git/*' | grep -q .; then
            python -m unittest discover -v
          else
            echo "No test command found. Add tests, or edit this template."
            exit 1
          fi

      - name: Build validation
        run: |
          python -m compileall -q .
          if [ -f pyproject.toml ] && grep -q '\[build-system\]' pyproject.toml; then
            python -m pip install --disable-pip-version-check build
            python -m build
          else
            echo "No build backend configured — compile check only."
          fi
