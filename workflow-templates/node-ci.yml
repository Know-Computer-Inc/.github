# Starter workflow: Node.js / TypeScript repository.
#
# Assumptions (edit them if they are wrong for your repository):
#   - npm with a committed package-lock.json;
#   - scripts named typecheck / lint / format:check / test / build;
#   - Node 22 (add another matrix entry if you support a second major).
#
# The test step fails when no test script exists — a green check without tests
# is worse than a red one. Build stays optional: a library does not need one.

name: Node CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json — committing one is recommended for reproducible installs."
            npm install --no-audit --no-fund
          fi

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Format check
        run: npm run format:check --if-present

      - name: Test
        run: |
          if node -e "const s=(require('./package.json').scripts)||{}; process.exit(s.test?0:1)"; then
            npm run test
          else
            echo "No test script found. Add one, or edit this template."
            exit 1
          fi

      - name: Build
        run: npm run build --if-present
