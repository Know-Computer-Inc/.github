<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Know Computer">
  <title>Know Computer — a new intelligence layer for personal computing</title>
  <rect width="1200" height="360" fill="#20221f"/>

  <!-- Know brand mark: rounded square, rotated 7 degrees, three bars -->
  <g transform="translate(568,64) scale(1.524)">
    <g transform="rotate(-7 21 21)">
      <rect x="1" y="1" width="40" height="40" rx="13" fill="none" stroke="#f7f7f4" stroke-width="2"/>
      <rect x="11" y="12" width="4" height="18" rx="2" fill="#f7f7f4" transform="rotate(7 13 21)"/>
      <rect x="21" y="8" width="4" height="26" rx="2" fill="#f7f7f4" transform="rotate(7 23 21)"/>
      <rect x="31" y="14" width="4" height="14" rx="2" fill="#f7f7f4" transform="rotate(7 33 21)"/>
    </g>
  </g>

  <text x="600" y="232" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="88" font-weight="650" letter-spacing="-3" fill="#f7f7f4">know</text>

  <line x1="552" y1="268" x2="648" y2="268" stroke="#63785a" stroke-width="2"/>

  <text x="600" y="306" text-anchor="middle"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="3.6" fill="#a5a79f">A NEW INTELLIGENCE LAYER FOR PERSONAL COMPUTING</text>
</svg>
